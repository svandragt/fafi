name: Release

on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]

jobs:
  build:
    # go-sqlite3 needs cgo, so each platform builds on its own runner instead of cross-compiling.
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test
        run: go test -race -tags fts5 ./...

      - name: Build
        run: go build --tags fts5 -o dist/fafi2-${{ github.ref_name }}-${{ matrix.target }} fafi2

      - uses: actions/upload-artifact@v7
        with:
          name: fafi2-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --title "${{ github.ref_name }}" --notes ""
